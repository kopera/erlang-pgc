name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.2.0)
        required: true
        type: string
      author-name:
        description: Name of the author of the release commits
        required: true
        type: string
      author-email:
        description: Email of the author of the release commits
        required: true
        type: string

concurrency: release

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      VERSION: ${{ inputs.version }}
      AUTHOR_NAME: ${{ inputs.author-name }}
      AUTHOR_EMAIL: ${{ inputs.author-email }}
      EX_DOC_VERSION: "0.40.4"

    steps:
      - name: Validate the inputs
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version"
            exit 1
          fi
          if [[ ! "$AUTHOR_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+$ ]]; then
            echo "::error::'$AUTHOR_EMAIL' is not a valid email"
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7

      - name: Check that the release does not exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          rebar3-version: "3.27.1"

      - name: Setup rebar3 hex
        run: |
          mkdir -p ~/.config/rebar3/
          echo '{plugins, [{rebar3_hex, "7.3.0"}]}.' >> ~/.config/rebar3/rebar.config

      - name: Set the version in the manifest
        run: |
          sed -i "s/{vsn, git}/{vsn, \"$VERSION\"}/" src/pgc.app.src
          grep -q "{vsn, \"$VERSION\"}" src/pgc.app.src

      - name: Run unit tests
        run: rebar3 eunit

      - name: Run common tests
        run: rebar3 ct

      - name: Compile
        run: rebar3 compile

      - name: Install ex_doc
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error \
            --remote-name "https://github.com/elixir-lang/ex_doc/releases/download/v$EX_DOC_VERSION/ex_doc_otp_29" \
            --remote-name "https://github.com/elixir-lang/ex_doc/releases/download/v$EX_DOC_VERSION/ex-doc-otp-29.sha256sum"
          sha256sum --check ex-doc-otp-29.sha256sum
          chmod +x ex_doc_otp_29

      - name: Build the documentation
        run: |
          "$RUNNER_TEMP/ex_doc_otp_29" pgc "$VERSION" _build/default/lib/pgc/ebin \
            --config docs.config --output doc --warnings-as-errors

      - name: Commit the release
        id: commit
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git commit --all --message "Release $VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the Hex package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: rebar3 hex publish --repo hexpm --doc-dir doc --dry-run --yes

      - name: Push the release commit
        run: git push origin HEAD:main

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "v$VERSION" \
            --generate-notes

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: rebar3 hex publish --repo hexpm --doc-dir doc --yes

      - name: Add the Hex links to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(gh release view "v$VERSION" --json body --jq .body)"
          gh release edit "v$VERSION" --notes "- Hex: https://hex.pm/packages/pgc/$VERSION
          - HexDocs: https://pgc.hexdocs.pm/$VERSION

          $notes"

      - name: Post release version bump
        run: |
          sed -i "s/{vsn, \"$VERSION\"}/{vsn, git}/" src/pgc.app.src
          git commit --all --message "Post release version bump"
          git push origin HEAD:main
